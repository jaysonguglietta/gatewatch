misconfigurations:
  - id: AWS-0135
    paths:
      - "infrastructure/cloudformation/gatewatch-aws-web.yaml"
    expired_at: 2027-02-19
    statement: >-
      SEC-EX-002: ADX synchronization messages contain only opaque source IDs,
      dispatch metadata, and retry controls; credentials and AWS evidence never
      enter either queue. Both queues use the AWS-managed SQS KMS key. Owner:
      Gatewatch security maintainer. Move to a dedicated customer-managed key
      when per-queue key administration or cross-account delivery is required.
  - id: AWS-0104
    paths:
      - "infrastructure/cloudformation/gatewatch-aws-web.yaml"
    expired_at: 2026-11-12
    statement: >-
      SEC-EX-001: the private web and bridge workloads require outbound HTTPS
      to Cognito, STS, Bedrock, the approved Jira tenant, and the pinned image
      registry through the NAT gateway. Egress is TCP/443 only; containers are
      isolated, IMDS is denied except to the bridge, and the bridge assumes a
      scoped role. Owner: Gatewatch security maintainer. Replace this exception
      with VPC endpoints plus an authenticated FQDN egress proxy by 2026-11-12.
