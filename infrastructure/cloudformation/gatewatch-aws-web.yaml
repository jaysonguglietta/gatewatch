AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Gatewatch web dashboard for a small internal security team. Runs the complete
  application on a hardened EC2 node behind CloudFront HTTPS with encrypted
  persistent review state, Secrets Manager authentication, SSM administration,
  and read-only access to the Gatewatch security-group snapshot in S3.

Parameters:
  EnvironmentName:
    Type: String
    Default: personal
    AllowedPattern: "^[a-z0-9-]{2,24}$"
  ArtifactBucket:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  ArtifactKey:
    Type: String
    MinLength: 1
    MaxLength: 1024
  ArtifactVersionId:
    Type: String
    MinLength: 1
    MaxLength: 1024
    AllowedPattern: "^[A-Za-z0-9._-]+$"
    Description: Immutable S3 VersionId for the release artifact.
  ArtifactSha256:
    Type: String
    AllowedPattern: "^[a-f0-9]{64}$"
    Description: Expected SHA-256 digest for the exact release artifact bytes.
  ImageArtifactKey:
    Type: String
    MinLength: 1
    MaxLength: 1024
    AllowedPattern: "^releases/images/[a-f0-9]{64}/gatewatch-web[.]tar[.]gz$"
  ImageArtifactVersionId:
    Type: String
    MinLength: 1
    MaxLength: 1024
    AllowedPattern: "^[A-Za-z0-9._-]+$"
    Description: Immutable S3 VersionId for the scanned production image archive.
  ImageArtifactSha256:
    Type: String
    AllowedPattern: "^[a-f0-9]{64}$"
    Description: Expected SHA-256 digest for the attested production image archive.
  ApplicationImageRef:
    Type: String
    AllowedPattern: "^gatewatch-web:[a-f0-9]{40}$"
    Description: Exact image tag embedded in the verified release archive.
  SnapshotBucket:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  SnapshotKey:
    Type: String
    Default: exports/latest.json
  SnapshotManifestKey:
    Type: String
    Default: manifests/latest.json
    AllowedPattern: "^[A-Za-z0-9!_.*'()/=-]{1,1024}$"
  SnapshotRegion:
    Type: String
    Default: us-east-1
    AllowedPattern: "^[a-z0-9-]+-[0-9]$"
  OrganizationEvidenceBucket:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    Description: Optional EvidenceBucketName output from the organization collector.
  OrganizationManifestKey:
    Type: String
    Default: manifests/latest.json
    AllowedPattern: "^[A-Za-z0-9!_.*'()/=-]{1,1024}$"
  CloudFrontOriginPrefixListId:
    Type: String
    AllowedPattern: "^pl-[a-z0-9]+$"
  PublicDomainName:
    Type: String
    AllowedPattern: "^[a-z0-9](?:[a-z0-9.-]{1,251}[a-z0-9])$"
    Description: Public Gatewatch DNS name; the stack provisions and validates its ACM certificate.
  OriginDomainName:
    Type: String
    AllowedPattern: "^[a-z0-9](?:[a-z0-9.-]{1,251}[a-z0-9])$"
    Description: Dedicated private ALB origin DNS name; the stack provisions and validates its ACM certificate.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  BootstrapAdminEmail:
    Type: String
    AllowedPattern: '^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$'
  CognitoDomainPrefix:
    Type: String
    AllowedPattern: "^[a-z0-9](?:[a-z0-9-]{1,61}[a-z0-9])$"
    Description: Globally unique Cognito managed-login domain prefix.
  OAuth2ProxyImage:
    Type: String
    AllowedPattern: "^[^[:space:]@]+@sha256:[a-f0-9]{64}$"
    Description: Digest-pinned oauth2-proxy image.
  SnapshotKmsKeyArn:
    Type: String
    AllowedPattern: "^arn:[a-z0-9-]+:kms:[a-z0-9-]+:[0-9]{12}:key/[a-f0-9-]+$"
  OrganizationEvidenceKmsKeyArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[a-z0-9-]+:kms:[a-z0-9-]+:[0-9]{12}:key/[a-f0-9-]+$"
  SourceOrganizationId:
    Type: String
    AllowedPattern: "^o-[a-z0-9]{10,32}$"
    Description: AWS Organization containing every approved Gatewatch evidence role.
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues:
      - t4g.small
      - t4g.medium
  BedrockEnabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enables review-only Bedrock analyst workflows. Deterministic findings remain authoritative.
  BedrockModelId:
    Type: String
    Default: us.amazon.nova-2-lite-v1:0
    AllowedValues:
      - us.amazon.nova-2-lite-v1:0
    Description: US-geo inference profile approved for Gatewatch structured analysis.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Conditions:
  HasOrganizationEvidence: !Not [!Equals [!Ref OrganizationEvidenceBucket, ""]]
  HasOrganizationEvidenceKmsKey: !Not [!Equals [!Ref OrganizationEvidenceKmsKeyArn, ""]]

Resources:
  WebVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.83.0.0/24
      EnableDnsHostnames: true
      EnableDnsSupport: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: !Sub gatewatch-${EnvironmentName}

  WebInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub gatewatch-${EnvironmentName}

  WebInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref WebInternetGateway
      VpcId: !Ref WebVpc

  WebSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.83.0.0/26
      MapPublicIpOnLaunch: false
      VpcId: !Ref WebVpc
      Tags:
        - Key: Name
          Value: !Sub gatewatch-${EnvironmentName}-public-a

  WebSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.83.0.64/26
      MapPublicIpOnLaunch: false
      VpcId: !Ref WebVpc
      Tags:
        - Key: Name
          Value: !Sub gatewatch-${EnvironmentName}-public-b

  WebPrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.83.0.128/26
      MapPublicIpOnLaunch: false
      VpcId: !Ref WebVpc
      Tags:
        - Key: Name
          Value: !Sub gatewatch-${EnvironmentName}-private-a

  WebPrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.83.0.192/26
      MapPublicIpOnLaunch: false
      VpcId: !Ref WebVpc
      Tags:
        - Key: Name
          Value: !Sub gatewatch-${EnvironmentName}-private-b

  WebRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref WebVpc
      Tags:
        - Key: Name
          Value: !Sub gatewatch-${EnvironmentName}-public

  WebDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: WebInternetGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref WebInternetGateway
      RouteTableId: !Ref WebRouteTable

  WebSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref WebRouteTable
      SubnetId: !Ref WebSubnet

  WebSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref WebRouteTable
      SubnetId: !Ref WebSubnetB

  WebNatElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: WebInternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub gatewatch-${EnvironmentName}-nat

  WebNatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt WebNatElasticIp.AllocationId
      ConnectivityType: public
      SubnetId: !Ref WebSubnet
      Tags:
        - Key: Name
          Value: !Sub gatewatch-${EnvironmentName}-nat

  WebPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref WebVpc
      Tags:
        - Key: Name
          Value: !Sub gatewatch-${EnvironmentName}-private

  WebPrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref WebNatGateway
      RouteTableId: !Ref WebPrivateRouteTable

  WebPrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref WebPrivateRouteTable
      SubnetId: !Ref WebPrivateSubnet

  WebPrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref WebPrivateRouteTable
      SubnetId: !Ref WebPrivateSubnetB

  CloudFrontOriginSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Gatewatch CloudFront-to-origin authentication token
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  PublicCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref PublicDomainName
      DomainValidationOptions:
        - DomainName: !Ref PublicDomainName
          HostedZoneId: !Ref HostedZoneId
      ValidationMethod: DNS
      Tags:
        - Key: Name
          Value: !Sub gatewatch-${EnvironmentName}-public

  OriginCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref OriginDomainName
      DomainValidationOptions:
        - DomainName: !Ref OriginDomainName
          HostedZoneId: !Ref HostedZoneId
      ValidationMethod: DNS
      Tags:
        - Key: Name
          Value: !Sub gatewatch-${EnvironmentName}-private-origin

  AwsBridgeSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Gatewatch application-to-AWS-bridge bearer token
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  OidcCookieSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Gatewatch oauth2-proxy session-cookie encryption key
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true

  GatewatchUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub gatewatch-${EnvironmentName}
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: "ON"
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      DeletionProtection: ACTIVE
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 3
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        Application: Gatewatch
        DataClassification: Identity

  GatewatchUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref GatewatchUserPool
      ClientName: !Sub gatewatch-${EnvironmentName}-web
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Sub https://${PublicDomainName}/oauth2/callback
      LogoutURLs:
        - !Sub https://${PublicDomainName}/
      SupportedIdentityProviders:
        - COGNITO
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  GatewatchUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref GatewatchUserPool

  BootstrapAdminUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref GatewatchUserPool
      Username: !Ref BootstrapAdminEmail
      DesiredDeliveryMediums:
        - EMAIL
      UserAttributes:
        - Name: email
          Value: !Ref BootstrapAdminEmail
        - Name: email_verified
          Value: "true"

  JiraIntegrationSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Gatewatch Jira Cloud integration configuration and API token
      SecretString: '{"configured":false}'
      Tags:
        - Key: Application
          Value: Gatewatch
        - Key: DataClassification
          Value: Credential

  GatewatchAiGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub gatewatch-${EnvironmentName}-ai-guardrail
      Description: Prompt-attack protection for untrusted AWS evidence and Gatewatch analyst requests.
      BlockedInputMessaging: Gatewatch blocked untrusted instructions in the supplied evidence or analyst request.
      BlockedOutputsMessaging: Gatewatch blocked an unsafe model response. Deterministic findings remain available.
      ContentPolicyConfig:
        FiltersConfig:
          - Type: PROMPT_ATTACK
            InputStrength: HIGH
            OutputStrength: NONE
            InputAction: BLOCK
            OutputAction: NONE
            InputEnabled: true
            OutputEnabled: false
            InputModalities:
              - TEXT
      Tags:
        - Key: Application
          Value: Gatewatch
        - Key: Purpose
          Value: SecurityAnalysis

  GatewatchAiGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt GatewatchAiGuardrail.GuardrailId
      Description: Immutable Gatewatch analyst guardrail version.

  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RetentionInDays: 90

  EdgeAccessLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W3045
    Properties:
      AccessControl: LogDeliveryWrite
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireEdgeAccessLogs
            Status: Enabled
            ExpirationInDays: 400
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  WafLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub aws-waf-logs-gatewatch-${EnvironmentName}
      RetentionInDays: 90

  GatewatchWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub gatewatch-${EnvironmentName}-edge
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub gatewatch-${EnvironmentName}-edge
        SampledRequestsEnabled: true
      Rules:
        - Name: AiAnalysisRateLimit
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              EvaluationWindowSec: 300
              Limit: 60
              ScopeDownStatement:
                ByteMatchStatement:
                  FieldToMatch:
                    UriPath: {}
                  PositionalConstraint: STARTS_WITH
                  SearchString: /api/ai/analysis
                  TextTransformations:
                    - Priority: 0
                      Type: NONE
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: AiAnalysisRateLimit
            SampledRequestsEnabled: true
        - Name: IacEvaluationRateLimit
          Priority: 1
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              EvaluationWindowSec: 300
              Limit: 100
              ScopeDownStatement:
                ByteMatchStatement:
                  FieldToMatch:
                    UriPath: {}
                  PositionalConstraint: STARTS_WITH
                  SearchString: /api/iac/evaluate
                  TextTransformations:
                    - Priority: 0
                      Type: NONE
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: IacEvaluationRateLimit
            SampledRequestsEnabled: true
        - Name: IpRateLimit
          Priority: 2
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              EvaluationWindowSec: 300
              Limit: 1000
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: IpRateLimit
            SampledRequestsEnabled: true
        - Name: AwsManagedCommon
          Priority: 10
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: AwsManagedCommon
            SampledRequestsEnabled: true
        - Name: AwsManagedKnownBadInputs
          Priority: 20
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: AwsManagedKnownBadInputs
            SampledRequestsEnabled: true
        - Name: AwsManagedIpReputation
          Priority: 30
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: AwsManagedIpReputation
            SampledRequestsEnabled: true

  GatewatchWafLogging:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      LogDestinationConfigs:
        - !GetAtt WafLogGroup.Arn
      ResourceArn: !GetAtt GatewatchWebAcl.Arn
      RedactedFields:
        - SingleHeader:
            Name: authorization
        - SingleHeader:
            Name: cookie

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Gatewatch web origin; CloudFront origin network only
      VpcId: !Ref WebVpc
      SecurityGroupEgress:
        - Description: TLS to AWS APIs, approved SaaS integrations, and the pinned OIDC image registry
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub gatewatch-${EnvironmentName}-web

  OriginLoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Gatewatch TLS origin; AWS-managed CloudFront origin network only
      VpcId: !Ref WebVpc
      SecurityGroupIngress:
        - Description: HTTPS from the AWS-managed CloudFront origin network
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourcePrefixListId: !Ref CloudFrontOriginPrefixListId
      SecurityGroupEgress:
        - Description: Forward authenticated edge traffic to the Gatewatch node
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          DestinationSecurityGroupId: !Ref WebSecurityGroup

  WebIngressFromOriginLoadBalancer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: HTTP from the dedicated TLS origin load balancer
      GroupId: !Ref WebSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !Ref OriginLoadBalancerSecurityGroup

  WebInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: GatewatchWebRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadDeploymentArtifact
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucket}/${ArtifactKey}
              - Sid: ReadProductionImageArtifact
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucket}/${ImageArtifactKey}
              - Sid: ReadBootstrapSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref CloudFrontOriginSecret
                  - !Ref AwsBridgeSecret
                  - !Ref OidcCookieSecret
              - Sid: PublishApplicationLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource: !Sub ${ApplicationLogGroup.Arn}:*

  AwsBridgeRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      Description: AWS permissions available only to the isolated Gatewatch bridge container.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt WebInstanceRole.Arn
            Action: sts:AssumeRole
      MaxSessionDuration: 3600
      Policies:
        - PolicyName: GatewatchBridgeRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadSecurityGroupSnapshot
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${SnapshotBucket}/${SnapshotKey}
                  - !Sub arn:${AWS::Partition}:s3:::${SnapshotBucket}/${SnapshotManifestKey}
              - !If
                - HasOrganizationEvidence
                - Sid: ReadOrganizationCoverageManifest
                  Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub arn:${AWS::Partition}:s3:::${OrganizationEvidenceBucket}/${OrganizationManifestKey}
                - !Ref AWS::NoValue
              - Sid: DecryptS3Objects
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource:
                  - !Ref SnapshotKmsKeyArn
                  - !If [HasOrganizationEvidenceKmsKey, !Ref OrganizationEvidenceKmsKeyArn, !Ref AWS::NoValue]
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub s3.${AWS::Region}.${AWS::URLSuffix}
              - Sid: ManageJiraIntegrationSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                Resource: !Ref JiraIntegrationSecret
              - Sid: InvokeApprovedGatewatchModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/amazon.nova-2-lite-v1:0
                  - !Sub arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/amazon.nova-2-lite-v1:0
                  - !Sub arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/amazon.nova-2-lite-v1:0
              - Sid: ApplyGatewatchGuardrail
                Effect: Allow
                Action: bedrock:ApplyGuardrail
                Resource: !GetAtt GatewatchAiGuardrail.GuardrailArn
              - Sid: AssumeConfiguredEvidenceRoles
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub arn:${AWS::Partition}:iam::*:role/GatewatchLogReadRole*
                Condition:
                  StringEquals:
                    aws:ResourceOrgID: !Ref SourceOrganizationId

  WebAssumeBridgeRuntimePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: AssumeGatewatchBridgeRuntime
      Roles:
        - !Ref WebInstanceRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Resource: !GetAtt AwsBridgeRuntimeRole.Arn

  WebInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref WebInstanceRole

  WebFileSystemSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Gatewatch persistent filesystem; web node only
      VpcId: !Ref WebVpc
      SecurityGroupIngress:
        - Description: NFS from the Gatewatch web node
          IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref WebSecurityGroup
      SecurityGroupEgress:
        - Description: Stateful NFS responses
          IpProtocol: "-1"
          CidrIp: 127.0.0.1/32

  WebEgressToFileSystem:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      Description: NFS to the encrypted Gatewatch EFS mount only
      DestinationSecurityGroupId: !Ref WebFileSystemSecurityGroup
      FromPort: 2049
      GroupId: !Ref WebSecurityGroup
      IpProtocol: tcp
      ToPort: 2049

  WebFileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BackupPolicy:
        Status: ENABLED
      Encrypted: true
      FileSystemTags:
        - Key: Name
          Value: !Sub gatewatch-${EnvironmentName}-data
      LifecyclePolicies:
        - TransitionToIA: AFTER_30_DAYS
      PerformanceMode: generalPurpose
      ThroughputMode: elastic

  WebFileSystemAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref WebFileSystem
      PosixUser:
        Gid: "1000"
        Uid: "1000"
      RootDirectory:
        CreationInfo:
          OwnerGid: "1000"
          OwnerUid: "1000"
          Permissions: "0750"
        Path: /gatewatch

  WebFileSystemMountTarget:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref WebFileSystem
      SecurityGroups:
        - !Ref WebFileSystemSecurityGroup
      SubnetId: !Ref WebPrivateSubnet

  WebInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - WebPrivateDefaultRoute
      - WebFileSystemMountTarget
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref WebInstanceProfile
      Monitoring: true
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
        InstanceMetadataTags: enabled
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeleteOnTermination: true
          DeviceIndex: "0"
          GroupSet:
            - !Ref WebSecurityGroup
          SubnetId: !Ref WebPrivateSubnet
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 20
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub gatewatch-${EnvironmentName}-web
        - Key: gatewatch:component
          Value: web-runtime
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y amazon-efs-utils docker nginx httpd-tools unzip jq
          systemctl enable --now docker
          systemctl enable nginx

          mkdir -p /srv/gatewatch
          echo '${WebFileSystem}:/ /srv/gatewatch efs _netdev,tls,accesspoint=${WebFileSystemAccessPoint} 0 0' >>/etc/fstab
          mount -a -t efs

          fallocate -l 2G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' >>/etc/fstab
          touch /var/lib/gatewatch-bootstrap-ready

  OriginLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      IpAddressType: ipv4
      Scheme: internal
      SecurityGroups:
        - !Ref OriginLoadBalancerSecurityGroup
      Subnets:
        - !Ref WebPrivateSubnet
        - !Ref WebPrivateSubnetB
      Type: application
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: "true"
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: routing.http.xff_client_port.enabled
          Value: "true"

  OriginTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /healthz
      HealthCheckPort: traffic-port
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      Port: 80
      Protocol: HTTP
      ProtocolVersion: HTTP1
      Targets:
        - Id: !Ref WebInstance
          Port: 80
      TargetType: instance
      VpcId: !Ref WebVpc

  OriginHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      Certificates:
        - CertificateArn: !Ref OriginCertificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref OriginTargetGroup
      LoadBalancerArn: !Ref OriginLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06

  OriginDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName: !GetAtt OriginLoadBalancer.DNSName
        EvaluateTargetHealth: true
        HostedZoneId: !GetAtt OriginLoadBalancer.CanonicalHostedZoneID
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref OriginDomainName
      Type: A

  WebDeploymentAssociation:
    Type: AWS::SSM::Association
    DependsOn:
      - WebFileSystemMountTarget
      - WebAssumeBridgeRuntimePolicy
    Properties:
      Name: AWS-RunShellScript
      AssociationName: !Sub gatewatch-${EnvironmentName}-web-deployment
      WaitForSuccessTimeoutSeconds: 1200
      Targets:
        - Key: InstanceIds
          Values:
            - !Ref WebInstance
      Parameters:
        commands:
          - !Sub |
              set -euo pipefail
              for ATTEMPT in $(seq 1 120); do
                [ -f /var/lib/gatewatch-bootstrap-ready ] && break
                sleep 5
              done
              test -f /var/lib/gatewatch-bootstrap-ready
              rm -rf /opt/gatewatch-release /tmp/gatewatch-release.zip /tmp/gatewatch-web.tar.gz
              aws s3api get-object \
                --bucket '${ArtifactBucket}' \
                --key '${ArtifactKey}' \
                --version-id '${ArtifactVersionId}' \
                --region '${AWS::Region}' \
                /tmp/gatewatch-release.zip >/dev/null
              printf '%s  %s\n' '${ArtifactSha256}' /tmp/gatewatch-release.zip | sha256sum -c -
              aws s3api get-object \
                --bucket '${ArtifactBucket}' \
                --key '${ImageArtifactKey}' \
                --version-id '${ImageArtifactVersionId}' \
                --region '${AWS::Region}' \
                /tmp/gatewatch-web.tar.gz >/dev/null
              printf '%s  %s\n' '${ImageArtifactSha256}' /tmp/gatewatch-web.tar.gz | sha256sum -c -
              mkdir -p /opt/gatewatch-release
              unzip -q /tmp/gatewatch-release.zip -d /opt/gatewatch-release
              cd /opt/gatewatch-release
              chmod +x infrastructure/aws-web/install.sh
              RELEASE_ID=$(printf '%s' '${ArtifactKey}' | sha256sum | cut -c1-12)
              ./infrastructure/aws-web/install.sh \
                '${AWS::Region}' \
                '${CloudFrontOriginSecret}' \
                '${AwsBridgeSecret}' \
                '${OidcCookieSecret}' \
                '${JiraIntegrationSecret}' \
                '${GatewatchUserPool}' \
                '${GatewatchUserPoolClient}' \
                '${CognitoDomainPrefix}' \
                'https://${PublicDomainName}' \
                '${BootstrapAdminEmail}' \
                '${SnapshotBucket}' \
                '${SnapshotKey}' \
                '${SnapshotManifestKey}' \
                '${SnapshotRegion}' \
                '${OrganizationEvidenceBucket}' \
                '${OrganizationManifestKey}' \
                '${AwsBridgeRuntimeRole.Arn}' \
                '${ApplicationLogGroup}' \
                "$RELEASE_ID" \
                '${BedrockEnabled}' \
                '${BedrockModelId}' \
                '${GatewatchAiGuardrail.GuardrailId}' \
                '${GatewatchAiGuardrailVersion.Version}' \
                '${OAuth2ProxyImage}' \
                '${ApplicationImageRef}' \
                '/tmp/gatewatch-web.tar.gz' \
                '${ImageArtifactSha256}'

  NoCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub gatewatch-${EnvironmentName}-no-cache
        Comment: Gatewatch contains user-specific workflow state and must not be cached.
        DefaultTTL: 0
        MaxTTL: 0
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: false
          EnableAcceptEncodingGzip: false
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  AllViewerOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub gatewatch-${EnvironmentName}-all-viewer
        Comment: Forward viewer context without forwarding a Host header that would break origin TLS validation.
        CookiesConfig:
          CookieBehavior: all
        HeadersConfig:
          HeaderBehavior: allExcept
          Headers:
            - host
        QueryStringsConfig:
          QueryStringBehavior: all

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub gatewatch-${EnvironmentName}-security-headers
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: same-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: >-
              default-src 'self'; base-uri 'self'; frame-ancestors 'none';
              object-src 'none'; form-action 'self'; img-src 'self' data:;
              font-src 'self' data:; style-src 'self' 'unsafe-inline';
              script-src 'self' 'unsafe-inline'; connect-src 'self';
              upgrade-insecure-requests
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), geolocation=(), microphone=(), payment=(), usb=()
              Override: true

  PrivateWebVpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Arn: !Ref OriginLoadBalancer
        HTTPPort: 80
        HTTPSPort: 443
        Name: !Sub gatewatch-${EnvironmentName}-private-origin
        OriginProtocolPolicy: https-only
        OriginSSLProtocols:
          - TLSv1.2
      Tags:
        - Key: Name
          Value: !Sub gatewatch-${EnvironmentName}-private-origin

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn:
      - OriginHttpsListener
      - WebDeploymentAssociation
    Properties:
      DistributionConfig:
        Comment: !Sub Gatewatch ${EnvironmentName} web dashboard
        Enabled: true
        Aliases:
          - !Ref PublicDomainName
        HttpVersion: http2and3
        IPV6Enabled: true
        Logging:
          Bucket: !GetAtt EdgeAccessLogBucket.DomainName
          IncludeCookies: false
          Prefix: !Sub cloudfront/${EnvironmentName}/
        PriceClass: PriceClass_100
        WebACLId: !GetAtt GatewatchWebAcl.Arn
        Origins:
          - Id: gatewatch-web-origin
            DomainName: !Ref OriginDomainName
            ConnectionAttempts: 3
            ConnectionTimeout: 10
            OriginCustomHeaders:
              - HeaderName: X-Gatewatch-Origin
                HeaderValue: !Sub '{{resolve:secretsmanager:${CloudFrontOriginSecret}}}'
            VpcOriginConfig:
              VpcOriginId: !GetAtt PrivateWebVpcOrigin.Id
              OriginReadTimeout: 120
              OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: gatewatch-web-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - DELETE
            - GET
            - HEAD
            - OPTIONS
            - PATCH
            - POST
            - PUT
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: !Ref NoCachePolicy
          OriginRequestPolicyId: !Ref AllViewerOriginRequestPolicy
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          Compress: true
        ViewerCertificate:
          AcmCertificateArn: !Ref PublicCertificate
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only

  PublicDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName: !GetAtt WebDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref PublicDomainName
      Type: A

Outputs:
  DashboardUrl:
    Description: HTTPS URL for the Gatewatch web dashboard
    Value: !Sub https://${PublicDomainName}
  CognitoUserPoolId:
    Description: User pool providing individual identities and MFA.
    Value: !Ref GatewatchUserPool
  JiraIntegrationSecretArn:
    Description: Secret containing the Jira Cloud integration configuration.
    Value: !Ref JiraIntegrationSecret
  BedrockModelId:
    Description: Approved Bedrock inference profile used by Gatewatch.
    Value: !Ref BedrockModelId
  BedrockGuardrailId:
    Description: Versioned prompt-attack guardrail applied to Gatewatch inference.
    Value: !GetAtt GatewatchAiGuardrail.GuardrailId
  BedrockGuardrailVersion:
    Value: !GetAtt GatewatchAiGuardrailVersion.Version
  InstanceId:
    Value: !Ref WebInstance
  PersistentFileSystemId:
    Value: !Ref WebFileSystem
  CloudFrontDistributionId:
    Value: !Ref WebDistribution
