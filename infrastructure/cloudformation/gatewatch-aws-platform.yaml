AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Gatewatch AWS ingestion and database platform. Creates an encrypted Aurora
  PostgreSQL Serverless v2 cluster, SQS ingestion and dead-letter queues,
  a bounded idempotent ingestion worker, alarms, and least-privilege runtime IAM.

Parameters:
  EnvironmentName:
    Type: String
    Default: production
    AllowedPattern: "^[a-z0-9-]{2,32}$"
  VpcId:
    Type: AWS::EC2::VPC::Id
  DatabaseSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  DatabaseName:
    Type: String
    Default: gatewatch
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,62}$"
  MinAuroraCapacity:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 128
  MaxAuroraCapacity:
    Type: Number
    Default: 4
    MinValue: 1
    MaxValue: 128
  LambdaArtifactBucket:
    Type: String
    Description: Existing private S3 bucket containing the packaged ingestion Lambda.
  LambdaArtifactKey:
    Type: String
    Description: Versioned object key for the packaged ingestion Lambda zip.
  BackfillArtifactKey:
    Type: String
    Description: Versioned object key for the packaged backfill Lambda zip.
  GovernanceMaintenanceArtifactKey:
    Type: String
    Description: Versioned object key for the governance maintenance Lambda zip.
  WorkspaceId:
    Type: String
    AllowedPattern: "^[a-f0-9]{8}-[a-f0-9]{4}-[1-5][a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$"
    Description: Immutable workspace UUID owned by this platform deployment.
  AuditArchiveRetentionDays:
    Type: Number
    Default: 2555
    MinValue: 365
    MaxValue: 3650
    Description: Compliance-mode Object Lock retention for external audit archives.
  AlarmTopicArn:
    Type: String
    Default: ""
    Description: Optional existing SNS topic ARN for operational alarms.
  OrganizationId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^o-[a-z0-9]{10,32}$"
    Description: >
      Optional AWS Organizations ID. When supplied, EventBridge forwarding
      roles in that organization may send to the central ingestion queue.
  OrganizationEvidenceBucketName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    Description: >
      Optional EvidenceBucketName output from gatewatch-organization-collector.
      When supplied, inventory shards are routed to the ingestion queue.
  OrganizationEvidenceKeyArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[a-z0-9-]+:kms:[a-z0-9-]+-[0-9]:[0-9]{12}:key/[a-fA-F0-9-]{36}$"
    Description: EvidenceKeyArn output from gatewatch-organization-collector.

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, ""]]
  HasOrganization: !Not [!Equals [!Ref OrganizationId, ""]]
  HasOrganizationEvidence: !And
    - !Not [!Equals [!Ref OrganizationEvidenceBucketName, ""]]
    - !Not [!Equals [!Ref OrganizationEvidenceKeyArn, ""]]
  HasQueueIngress: !Or
    - !Condition HasOrganization
    - !Condition HasOrganizationEvidence

Resources:
  PlatformKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub Gatewatch ${EnvironmentName} platform encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: RootAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: AllowCloudWatchLogsEncryption
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*

  QueueKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub Gatewatch ${EnvironmentName} queue encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: RootAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: AllowAccountEventBridgeQueueEncryption
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - !If
            - HasOrganization
            - Sid: AllowOrganizationQueueProducers
              Effect: Allow
              Principal: "*"
              Action:
                - kms:Decrypt
                - kms:GenerateDataKey
              Resource: "*"
              Condition:
                StringEquals:
                  aws:PrincipalOrgID: !Ref OrganizationId
                ArnLike:
                  aws:PrincipalArn: !Sub arn:${AWS::Partition}:iam::*:role/GatewatchEventForwardingRole-*
            - !Ref AWS::NoValue

  # The server-access-log destination must not log to itself; AWS warns that
  # doing so creates an infinite delivery loop. This is the terminal log sink.
  #trivy:ignore:AVD-AWS-0089
  AuditAccessLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAuditAccessLogs
            Status: Enabled
            ExpirationInDays: 3650
            NoncurrentVersionExpiration:
              NoncurrentDays: 365
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Application
          Value: Gatewatch
        - Key: DataClassification
          Value: SecurityAuditAccessLog

  AuditAccessLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuditAccessLogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PermitAuditArchiveAccessLogDelivery
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${AuditAccessLogBucket.Arn}/audit-archive-access/*
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt AuditAccessLogBucket.Arn
              - !Sub ${AuditAccessLogBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  AuditArchiveBucket:
    Type: AWS::S3::Bucket
    DependsOn: AuditAccessLogBucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              KMSMasterKeyID: !GetAtt PlatformKey.Arn
              SSEAlgorithm: aws:kms
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Days: !Ref AuditArchiveRetentionDays
            Mode: COMPLIANCE
      LoggingConfiguration:
        DestinationBucketName: !Ref AuditAccessLogBucket
        LogFilePrefix: audit-archive-access/
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Application
          Value: Gatewatch
        - Key: DataClassification
          Value: SecurityAudit

  AuditArchiveBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuditArchiveBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt AuditArchiveBucket.Arn
              - !Sub ${AuditArchiveBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Gatewatch private database subnets
      SubnetIds: !Ref DatabaseSubnetIds

  RuntimeDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Gatewatch non-owner ingestion database credential
      KmsKeyId: !GetAtt PlatformKey.Arn
      GenerateSecretString:
        SecretStringTemplate: '{"username":"gatewatch_runtime_login"}'
        GenerateStringKey: password
        ExcludeCharacters: >-
          '"@/\
        PasswordLength: 40

  MaintenanceDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Gatewatch non-owner governance-maintenance database credential
      KmsKeyId: !GetAtt PlatformKey.Arn
      GenerateSecretString:
        SecretStringTemplate: '{"username":"gatewatch_maintenance_login"}'
        GenerateStringKey: password
        ExcludeCharacters: >-
          '"@/\
        PasswordLength: 40

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Gatewatch Aurora; Data API only, no inbound network access
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
          Description: Deny practical egress while satisfying CloudFormation syntax

  DatabaseCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      BackupRetentionPeriod: 35
      CopyTagsToSnapshot: true
      DatabaseName: !Ref DatabaseName
      DBClusterIdentifier: !Sub gatewatch-${EnvironmentName}
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      DeletionProtection: true
      Engine: aurora-postgresql
      EngineMode: provisioned
      EnableHttpEndpoint: true
      EnableCloudwatchLogsExports:
        - postgresql
      KmsKeyId: !GetAtt PlatformKey.Arn
      ManageMasterUserPassword: true
      MasterUsername: gatewatch_admin
      MasterUserSecret:
        KmsKeyId: !GetAtt PlatformKey.Arn
      Port: 5432
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref MinAuroraCapacity
        MaxCapacity: !Ref MaxAuroraCapacity
      StorageEncrypted: true
      VpcSecurityGroupIds:
        - !Ref DatabaseSecurityGroup

  DatabaseInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref DatabaseCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false

  DatabasePrincipalBootstrapRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BootstrapNonOwnerDatabasePrincipals
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${DatabasePrincipalBootstrapLogGroup.Arn}:*
              - Effect: Allow
                Action: rds-data:ExecuteStatement
                Resource: !GetAtt DatabaseCluster.DBClusterArn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !GetAtt DatabaseCluster.MasterUserSecret.SecretArn
                  - !Ref RuntimeDatabaseSecret
                  - !Ref MaintenanceDatabaseSecret
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt PlatformKey.Arn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub secretsmanager.${AWS::Region}.${AWS::URLSuffix}
              - Sid: XRayTelemetry
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  DatabasePrincipalBootstrapLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/gatewatch-${EnvironmentName}-database-principals
      RetentionInDays: 90
      KmsKeyId: !GetAtt PlatformKey.Arn

  DatabasePrincipalBootstrapFunction:
    Type: AWS::Lambda::Function
    DependsOn: DatabasePrincipalBootstrapLogGroup
    Properties:
      FunctionName: !Sub gatewatch-${EnvironmentName}-database-principals
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt DatabasePrincipalBootstrapRole.Arn
      Timeout: 120
      TracingConfig:
        Mode: Active
      Code:
        ZipFile: |
          import json, urllib.request, boto3
          rds = boto3.client("rds-data")
          secrets = boto3.client("secretsmanager")
          def respond(event, context, status, reason=""):
              body = json.dumps({"Status": status, "Reason": reason[:1000], "PhysicalResourceId": "gatewatch-database-principals", "StackId": event["StackId"], "RequestId": event["RequestId"], "LogicalResourceId": event["LogicalResourceId"]}).encode()
              request = urllib.request.Request(event["ResponseURL"], data=body, method="PUT", headers={"content-type": "", "content-length": str(len(body))})
              urllib.request.urlopen(request, timeout=10).read()
          def sql(props, statement):
              return rds.execute_statement(resourceArn=props["ClusterArn"], secretArn=props["MasterSecretArn"], database=props["DatabaseName"], sql=statement)
          def credential(secret_arn):
              value = json.loads(secrets.get_secret_value(SecretId=secret_arn)["SecretString"])
              if not value.get("password") or "'" in value["password"]:
                  raise ValueError("generated database password is invalid")
              return value
          def handler(event, context):
              try:
                  if event["RequestType"] != "Delete":
                      props = event["ResourceProperties"]
                      runtime = credential(props["RuntimeSecretArn"])
                      maintenance = credential(props["MaintenanceSecretArn"])
                      role_statement = """
                      DO $gatewatch$
                      BEGIN
                        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='gatewatch_ingest') THEN CREATE ROLE gatewatch_ingest NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS; END IF;
                        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='gatewatch_maintenance') THEN CREATE ROLE gatewatch_maintenance NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS; END IF;
                        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='gatewatch_runtime_login') THEN CREATE ROLE gatewatch_runtime_login LOGIN; END IF;
                        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='gatewatch_maintenance_login') THEN CREATE ROLE gatewatch_maintenance_login LOGIN; END IF;
                      END $gatewatch$;
                      """
                      statements = [
                          role_statement,
                          # Aurora's managed master user can rotate passwords for roles it
                          # creates, but PostgreSQL reserves changes to superuser-only role
                          # attributes (even when the requested value is false). The roles
                          # are created above with safe defaults and verified below, so keep
                          # rotation limited to the password attribute.
                          f"ALTER ROLE gatewatch_runtime_login PASSWORD '{runtime['password']}'",
                          f"ALTER ROLE gatewatch_maintenance_login PASSWORD '{maintenance['password']}'",
                          "GRANT gatewatch_ingest TO gatewatch_runtime_login",
                          "GRANT gatewatch_maintenance TO gatewatch_maintenance_login",
                          "DO $verify$ BEGIN IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname IN ('gatewatch_runtime_login','gatewatch_maintenance_login','gatewatch_ingest','gatewatch_maintenance') AND (rolsuper OR rolcreatedb OR rolcreaterole OR rolbypassrls)) THEN RAISE EXCEPTION 'Gatewatch workload role is privileged'; END IF; END $verify$",
                      ]
                      for index, statement in enumerate(statements):
                          try:
                              sql(props, statement)
                          except Exception as error:
                              raise RuntimeError(f"database principal statement {index + 1} failed: {error}") from error
                  respond(event, context, "SUCCESS")
              except Exception as error:
                  respond(event, context, "FAILED", f"{type(error).__name__}: {error}")

  DatabasePrincipals:
    Type: Custom::GatewatchDatabasePrincipals
    DependsOn: DatabaseInstance
    Properties:
      ServiceToken: !GetAtt DatabasePrincipalBootstrapFunction.Arn
      ClusterArn: !GetAtt DatabaseCluster.DBClusterArn
      DatabaseName: !Ref DatabaseName
      MasterSecretArn: !GetAtt DatabaseCluster.MasterUserSecret.SecretArn
      RuntimeSecretArn: !Ref RuntimeDatabaseSecret
      MaintenanceSecretArn: !Ref MaintenanceDatabaseSecret

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub gatewatch-${EnvironmentName}-ingestion-dlq
      KmsMasterKeyId: !GetAtt QueueKey.Arn
      MessageRetentionPeriod: 1209600

  IngestionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub gatewatch-${EnvironmentName}-ingestion
      KmsMasterKeyId: !GetAtt QueueKey.Arn
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 5

  OrganizationQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: HasQueueIngress
    Properties:
      Queues:
        - !Ref IngestionQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - !If
            - HasOrganization
            - Sid: OrganizationEventForwardingRoles
              Effect: Allow
              Principal: "*"
              Action: sqs:SendMessage
              Resource: !GetAtt IngestionQueue.Arn
              Condition:
                StringEquals:
                  aws:PrincipalOrgID: !Ref OrganizationId
                ArnLike:
                  aws:PrincipalArn: !Sub arn:${AWS::Partition}:iam::*:role/GatewatchEventForwardingRole-*
            - !Ref AWS::NoValue
          - !If
            - HasOrganizationEvidence
            - Sid: OrganizationEvidenceEventBridge
              Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt IngestionQueue.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !GetAtt OrganizationEvidenceRule.Arn
                StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId
            - !Ref AWS::NoValue

  OrganizationEvidenceRule:
    Type: AWS::Events::Rule
    Condition: HasOrganizationEvidence
    Properties:
      Description: Routes immutable Gatewatch organization inventory shards to normalization.
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref OrganizationEvidenceBucketName
          object:
            key:
              - wildcard: runs/*/shards/account=*/region=*/inventory.json.gz
              - wildcard: runs/*/manifest.json
      State: ENABLED
      Targets:
        - Arn: !GetAtt IngestionQueue.Arn
          Id: GatewatchOrganizationEvidenceQueue

  IngestionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GatewatchIngestionRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/gatewatch-${EnvironmentName}-*:*
              - Sid: Queue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:SendMessage
                Resource: !GetAtt IngestionQueue.Arn
              - Sid: DataApi
                Effect: Allow
                Action:
                  - rds-data:ExecuteStatement
                  - rds-data:BatchExecuteStatement
                  - rds-data:BeginTransaction
                  - rds-data:CommitTransaction
                  - rds-data:RollbackTransaction
                Resource: !GetAtt DatabaseCluster.DBClusterArn
              - Sid: DatabaseSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref RuntimeDatabaseSecret
              - Sid: DecryptRuntimeConfiguration
                Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt PlatformKey.Arn
                Condition:
                  StringEquals:
                    kms:ViaService:
                      - !Sub secretsmanager.${AWS::Region}.${AWS::URLSuffix}
                      - !Sub lambda.${AWS::Region}.${AWS::URLSuffix}
              - Sid: QueueEncryption
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt QueueKey.Arn
              - Sid: XRayTelemetry
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"
              - Sid: AssumeTaggedSourceRoles
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub arn:${AWS::Partition}:iam::*:role/GatewatchLogReadRole*
              - !If
                - HasOrganizationEvidence
                - Sid: ReadOrganizationEvidence
                  Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:GetObjectVersion
                  Resource:
                    - !Sub arn:${AWS::Partition}:s3:::${OrganizationEvidenceBucketName}/runs/*/shards/*
                    - !Sub arn:${AWS::Partition}:s3:::${OrganizationEvidenceBucketName}/runs/*/manifest.json
                - !Ref AWS::NoValue
              - !If
                - HasOrganizationEvidence
                - Sid: DecryptOrganizationEvidence
                  Effect: Allow
                  Action:
                    - kms:Decrypt
                    - kms:DescribeKey
                  Resource: !Ref OrganizationEvidenceKeyArn
                - !Ref AWS::NoValue

  IngestionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/gatewatch-${EnvironmentName}-ingest
      RetentionInDays: 90
      KmsKeyId: !GetAtt PlatformKey.Arn

  IngestionFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - IngestionLogGroup
      - DatabasePrincipals
    Properties:
      FunctionName: !Sub gatewatch-${EnvironmentName}-ingest
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt IngestionRole.Arn
      Architectures:
        - arm64
      MemorySize: 1536
      Timeout: 300
      ReservedConcurrentExecutions: 10
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: !Ref LambdaArtifactKey
      Environment:
        Variables:
          DATABASE_NAME: !Ref DatabaseName
          DB_CLUSTER_ARN: !GetAtt DatabaseCluster.DBClusterArn
          DB_SECRET_ARN: !Ref RuntimeDatabaseSecret
          WORKSPACE_ID: !Ref WorkspaceId
          ORGANIZATION_EVIDENCE_BUCKET: !Ref OrganizationEvidenceBucketName
      KmsKeyArn: !GetAtt PlatformKey.Arn
      TracingConfig:
        Mode: Active

  BackfillLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/gatewatch-${EnvironmentName}-backfill
      RetentionInDays: 90
      KmsKeyId: !GetAtt PlatformKey.Arn

  BackfillFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - BackfillLogGroup
      - DatabasePrincipals
    Properties:
      FunctionName: !Sub gatewatch-${EnvironmentName}-backfill
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt IngestionRole.Arn
      Architectures:
        - arm64
      MemorySize: 1024
      Timeout: 300
      ReservedConcurrentExecutions: 2
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: !Ref BackfillArtifactKey
      Environment:
        Variables:
          DATABASE_NAME: !Ref DatabaseName
          DB_CLUSTER_ARN: !GetAtt DatabaseCluster.DBClusterArn
          DB_SECRET_ARN: !Ref RuntimeDatabaseSecret
          INGESTION_QUEUE_URL: !Ref IngestionQueue
          WORKSPACE_ID: !Ref WorkspaceId
      KmsKeyArn: !GetAtt PlatformKey.Arn
      TracingConfig:
        Mode: Active

  GovernanceMaintenanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GatewatchGovernanceMaintenance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${GovernanceMaintenanceLogGroup.Arn}:*
              - Sid: XRayTelemetry
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"
              - Sid: DataApi
                Effect: Allow
                Action:
                  - rds-data:BeginTransaction
                  - rds-data:CommitTransaction
                  - rds-data:ExecuteStatement
                  - rds-data:RollbackTransaction
                Resource: !GetAtt DatabaseCluster.DBClusterArn
              - Sid: ReadDatabaseSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref MaintenanceDatabaseSecret
              - Sid: DecryptDatabaseSecret
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt PlatformKey.Arn
                Condition:
                  ForAnyValue:StringEquals:
                    kms:ViaService:
                      - !Sub lambda.${AWS::Region}.${AWS::URLSuffix}
                      - !Sub s3.${AWS::Region}.${AWS::URLSuffix}
                      - !Sub secretsmanager.${AWS::Region}.${AWS::URLSuffix}
              - Sid: AppendAuditArchive
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub ${AuditArchiveBucket.Arn}/audit/workspace=${WorkspaceId}/*

  GovernanceMaintenanceLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/gatewatch-${EnvironmentName}-governance-maintenance
      RetentionInDays: 365
      KmsKeyId: !GetAtt PlatformKey.Arn

  GovernanceMaintenanceFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - GovernanceMaintenanceLogGroup
      - DatabasePrincipals
    Properties:
      FunctionName: !Sub gatewatch-${EnvironmentName}-governance-maintenance
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt GovernanceMaintenanceRole.Arn
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 300
      ReservedConcurrentExecutions: 1
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: !Ref GovernanceMaintenanceArtifactKey
      Environment:
        Variables:
          AUDIT_ARCHIVE_BUCKET: !Ref AuditArchiveBucket
          DATABASE_NAME: !Ref DatabaseName
          DB_CLUSTER_ARN: !GetAtt DatabaseCluster.DBClusterArn
          DB_SECRET_ARN: !Ref MaintenanceDatabaseSecret
          RETENTION_BATCH_SIZE: "500"
          RETENTION_MAX_BATCHES: "20"
          WORKSPACE_ID: !Ref WorkspaceId
      KmsKeyArn: !GetAtt PlatformKey.Arn
      TracingConfig:
        Mode: Active

  GovernanceMaintenanceDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      KmsMasterKeyId: !GetAtt QueueKey.Arn
      MessageRetentionPeriod: 1209600

  GovernanceMaintenanceSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Archives immutable audit events and enforces legal-hold-aware retention.
      ScheduleExpression: rate(1 hour)
      State: ENABLED
      Targets:
        - Arn: !GetAtt GovernanceMaintenanceFunction.Arn
          Id: GatewatchGovernanceMaintenance
          DeadLetterConfig:
            Arn: !GetAtt GovernanceMaintenanceDeadLetterQueue.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 21600
            MaximumRetryAttempts: 6

  GovernanceMaintenanceQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref GovernanceMaintenanceDeadLetterQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EventBridgeDeadLetters
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt GovernanceMaintenanceDeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt GovernanceMaintenanceSchedule.Arn
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  GovernanceMaintenancePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GovernanceMaintenanceFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt GovernanceMaintenanceSchedule.Arn

  GovernanceMaintenanceAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Gatewatch audit archival or retention enforcement failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref GovernanceMaintenanceFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue

  BackfillStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeBackfillWorker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt BackfillFunction.Arn

  BackfillStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub gatewatch-${EnvironmentName}-backfill
      RoleArn: !GetAtt BackfillStateMachineRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "List historical S3 evidence in bounded pages and enqueue object references.",
          "StartAt": "ListAndEnqueuePage",
          "States": {
            "ListAndEnqueuePage": {
              "Type": "Task",
              "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${BackfillFunction.Arn}",
                "Payload.$": "$"
              },
              "OutputPath": "$.Payload",
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.TooManyRequestsException"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 4,
                  "BackoffRate": 2
                }
              ],
              "Next": "BackfillComplete"
            },
            "BackfillComplete": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.done",
                  "BooleanEquals": true,
                  "Next": "Complete"
                }
              ],
              "Default": "ListAndEnqueuePage"
            },
            "Complete": { "Type": "Succeed" }
          }
        }

  QueueEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 10
      EventSourceArn: !GetAtt IngestionQueue.Arn
      FunctionName: !Ref IngestionFunction
      FunctionResponseTypes:
        - ReportBatchItemFailures
      MaximumBatchingWindowInSeconds: 5
      ScalingConfig:
        MaximumConcurrency: 10

  QueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Gatewatch ingestion is falling behind.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt IngestionQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue

  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Gatewatch objects reached the ingestion dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Gatewatch ingestion Lambda returned errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestionFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue

Outputs:
  PlatformKeyArn:
    Description: KMS key used by platform data and the cross-stack application audit writer.
    Value: !GetAtt PlatformKey.Arn
  QueueKeyArn:
    Description: Dedicated KMS key used by ingestion and maintenance queues.
    Value: !GetAtt QueueKey.Arn
  WorkspaceId:
    Description: Immutable workspace identity bound to this platform deployment.
    Value: !Ref WorkspaceId
  DatabaseClusterArn:
    Value: !GetAtt DatabaseCluster.DBClusterArn
  DatabaseSecretArn:
    Value: !GetAtt DatabaseCluster.MasterUserSecret.SecretArn
  IngestionQueueArn:
    Value: !GetAtt IngestionQueue.Arn
  IngestionQueueUrl:
    Value: !Ref IngestionQueue
  IngestionFunctionArn:
    Value: !GetAtt IngestionFunction.Arn
  BackfillStateMachineArn:
    Value: !Ref BackfillStateMachine
  GovernanceMaintenanceFunctionArn:
    Value: !GetAtt GovernanceMaintenanceFunction.Arn
  AuditArchiveBucketName:
    Value: !Ref AuditArchiveBucket
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
  OrganizationEvidenceRuleArn:
    Condition: HasOrganizationEvidence
    Value: !GetAtt OrganizationEvidenceRule.Arn
