AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Gatewatch organization-scale security-group collection plane. Discovers AWS
  Organizations accounts, uses a Step Functions Distributed Map to isolate each
  account collection, and stores encrypted immutable account/Region evidence
  shards plus explicit run coverage manifests.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Organization scope
        Parameters:
          - OrganizationTargetIds
          - ExcludedAccountIds
          - StackSetCallAs
          - MemberReadRoleName
          - RegionAllowList
      - Label:
          default: Collection behavior
        Parameters:
          - ScheduleExpression
          - MaximumAccountConcurrency
          - MaximumRegionConcurrency
          - EvidenceRetentionDays
          - LogRetentionDays
      - Label:
          default: Deployment artifact
        Parameters:
          - LambdaArtifactBucket
          - LambdaArtifactKey
          - AlarmTopicArn

Parameters:
  OrganizationTargetIds:
    Type: CommaDelimitedList
    Description: Organization root or OU IDs included in collection.
  ExcludedAccountIds:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9]{12}(,[0-9]{12})*$"
    Description: Optional comma-separated AWS account IDs to exclude.
  StackSetCallAs:
    Type: String
    Default: DELEGATED_ADMIN
    AllowedValues: [SELF, DELEGATED_ADMIN]
  MemberReadRoleName:
    Type: String
    Default: GatewatchSecurityGroupReadRole
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]{1,64}$"
  RegionAllowList:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9-]+-[0-9](,[a-z0-9-]+-[0-9])*$"
    Description: Leave blank to collect every Region enabled in each member account.
  ScheduleExpression:
    Type: String
    Default: rate(6 hours)
    AllowedPattern: '^(rate\([1-9][0-9]* (minute|minutes|hour|hours|day|days)\)|cron\(.+\))$'
  MaximumAccountConcurrency:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 1000
  MaximumRegionConcurrency:
    Type: Number
    Default: 4
    MinValue: 1
    MaxValue: 8
  EvidenceRetentionDays:
    Type: Number
    Default: 400
    MinValue: 30
    MaxValue: 3650
  LogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [7, 14, 30, 60, 90, 120, 180, 365, 400, 545, 731, 1096]
  LambdaArtifactBucket:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    Description: Private S3 bucket containing the organization collector zip.
  LambdaArtifactKey:
    Type: String
    MinLength: 1
    MaxLength: 1024
    Description: Content-addressed S3 key containing index.py at the zip root.
  AlarmTopicArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[a-z0-9-]+:sns:[a-z0-9-]+-[0-9]:[0-9]{12}:[A-Za-z0-9-_]{1,256}$"

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, ""]]

Resources:
  EvidenceKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypts Gatewatch organization inventory evidence.
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: RootAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: AllowCloudWatchLogsEncryption
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
      Tags:
        - Key: Application
          Value: Gatewatch
        - Key: DataClassification
          Value: SecurityConfiguration

  EvidenceKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/gatewatch-${AWS::StackName}-organization-evidence
      TargetKeyId: !Ref EvidenceKey

  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt EvidenceKey.Arn
      LifecycleConfiguration:
        Rules:
          - Id: RetainImmutableRunEvidence
            Status: Enabled
            Prefix: runs/
            ExpirationInDays: !Ref EvidenceRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref EvidenceRetentionDays
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Application
          Value: Gatewatch
        - Key: DataClassification
          Value: SecurityConfiguration

  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt EvidenceBucket.Arn
              - !Sub ${EvidenceBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: DenyUnencryptedObjectWrites
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub ${EvidenceBucket.Arn}/*
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: aws:kms
          - Sid: DenyWrongEncryptionKey
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub ${EvidenceBucket.Arn}/*
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt EvidenceKey.Arn

  CollectionRunTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: runKey
          AttributeType: S
        - AttributeName: targetKey
          AttributeType: S
      KeySchema:
        - AttributeName: runKey
          KeyType: HASH
        - AttributeName: targetKey
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt EvidenceKey.Arn
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Application
          Value: Gatewatch

  DiscoveryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GatewatchOrganizationDiscovery
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadOrganization
                Effect: Allow
                Action:
                  - organizations:ListAccountsForParent
                  - organizations:ListOrganizationalUnitsForParent
                Resource: "*"
              - Sid: WriteRunState
                Effect: Allow
                Action:
                  - dynamodb:BatchWriteItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt CollectionRunTable.Arn
              - Sid: WriteTargets
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${EvidenceBucket.Arn}/runs/*/targets.json
              - Sid: EncryptEvidence
                Effect: Allow
                Action:
                  - kms:DescribeKey
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt EvidenceKey.Arn
              - Sid: LogsAndTracing
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GatewatchOrganizationWorker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AssumeMemberReadRoles
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub arn:${AWS::Partition}:iam::*:role/${MemberReadRoleName}
              - Sid: ReadCentralAccountInventory
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeNetworkAcls
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeRegions
                  - ec2:DescribeRouteTables
                  - ec2:DescribeSecurityGroupRules
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                Resource: "*"
              - Sid: UpdateTargetState
                Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt CollectionRunTable.Arn
              - Sid: WriteEvidenceShards
                Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub ${EvidenceBucket.Arn}/runs/*/shards/*
                  - !Sub ${EvidenceBucket.Arn}/runs/*/errors/*
              - Sid: EncryptEvidence
                Effect: Allow
                Action:
                  - kms:DescribeKey
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt EvidenceKey.Arn
              - Sid: LogsAndTracing
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  FinalizerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GatewatchCollectionFinalizer
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadAndFinalizeRun
                Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource: !GetAtt CollectionRunTable.Arn
              - Sid: WriteManifests
                Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub ${EvidenceBucket.Arn}/runs/*/manifest.json
                  - !Sub ${EvidenceBucket.Arn}/manifests/latest.json
              - Sid: EncryptEvidence
                Effect: Allow
                Action:
                  - kms:DescribeKey
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt EvidenceKey.Arn
              - Sid: LogsAndTracing
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  MemberReadRoleStackSet:
    Type: AWS::CloudFormation::StackSet
    Properties:
      StackSetName: !Sub ${AWS::StackName}-member-read-role
      Description: Deploys Gatewatch's least-privilege inventory role to organization accounts.
      PermissionModel: SERVICE_MANAGED
      CallAs: !Ref StackSetCallAs
      Capabilities: [CAPABILITY_NAMED_IAM]
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: false
      ManagedExecution:
        Active: true
      OperationPreferences:
        FailureTolerancePercentage: 10
        MaxConcurrentPercentage: 25
        RegionConcurrencyType: PARALLEL
      StackInstancesGroup:
        - DeploymentTargets:
            OrganizationalUnitIds: !Ref OrganizationTargetIds
          Regions:
            - !Ref AWS::Region
      TemplateBody: !Sub |
        AWSTemplateFormatVersion: "2010-09-09"
        Description: Gatewatch least-privilege security-group inventory role.
        Resources:
          MemberReadRole:
            Type: AWS::IAM::Role
            Properties:
              RoleName: ${MemberReadRoleName}
              Description: Read-only role assumed by the central Gatewatch organization collector.
              MaxSessionDuration: 3600
              AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Principal:
                      AWS: ${WorkerRole.Arn}
                    Action: sts:AssumeRole
                    Condition:
                      StringLike:
                        sts:RoleSessionName: gatewatch-*
              Policies:
                - PolicyName: ReadSecurityGroupInventory
                  PolicyDocument:
                    Version: "2012-10-17"
                    Statement:
                      - Effect: Allow
                        Action:
                          - ec2:DescribeInstances
                          - ec2:DescribeInternetGateways
                          - ec2:DescribeNetworkAcls
                          - ec2:DescribeNetworkInterfaces
                          - ec2:DescribeRegions
                          - ec2:DescribeRouteTables
                          - ec2:DescribeSecurityGroupRules
                          - ec2:DescribeSecurityGroups
                          - ec2:DescribeSubnets
                        Resource: "*"
              Tags:
                - Key: Application
                  Value: Gatewatch

  DiscoveryLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-discovery
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !GetAtt EvidenceKey.Arn

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-worker
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !GetAtt EvidenceKey.Arn

  FinalizerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-finalizer
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !GetAtt EvidenceKey.Arn

  DiscoveryFunction:
    Type: AWS::Lambda::Function
    DependsOn: DiscoveryLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-discovery
      Runtime: python3.13
      Handler: index.discovery_handler
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 300
      ReservedConcurrentExecutions: 2
      Role: !GetAtt DiscoveryRole.Arn
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: !Ref LambdaArtifactKey
      Environment:
        Variables:
          EVIDENCE_BUCKET: !Ref EvidenceBucket
          EXCLUDED_ACCOUNT_IDS: !Ref ExcludedAccountIds
          KMS_KEY_ARN: !GetAtt EvidenceKey.Arn
          MAX_REGION_CONCURRENCY: !Ref MaximumRegionConcurrency
          MEMBER_ROLE_NAME: !Ref MemberReadRoleName
          ORGANIZATION_TARGET_IDS: !Join [",", !Ref OrganizationTargetIds]
          PARTITION: !Ref AWS::Partition
          REGION_ALLOW_LIST: !Ref RegionAllowList
          RUN_TABLE: !Ref CollectionRunTable
          SOURCE_ACCOUNT_ID: !Ref AWS::AccountId
          SOURCE_REGION: !Ref AWS::Region
      KmsKeyArn: !GetAtt EvidenceKey.Arn
      TracingConfig:
        Mode: Active

  WorkerFunction:
    Type: AWS::Lambda::Function
    DependsOn: WorkerLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-worker
      Runtime: python3.13
      Handler: index.worker_handler
      Architectures: [arm64]
      MemorySize: 1536
      EphemeralStorage:
        Size: 1024
      Timeout: 900
      ReservedConcurrentExecutions: !Ref MaximumAccountConcurrency
      Role: !GetAtt WorkerRole.Arn
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: !Ref LambdaArtifactKey
      Environment:
        Variables:
          EVIDENCE_BUCKET: !Ref EvidenceBucket
          EXCLUDED_ACCOUNT_IDS: !Ref ExcludedAccountIds
          KMS_KEY_ARN: !GetAtt EvidenceKey.Arn
          MAX_REGION_CONCURRENCY: !Ref MaximumRegionConcurrency
          MEMBER_ROLE_NAME: !Ref MemberReadRoleName
          ORGANIZATION_TARGET_IDS: !Join [",", !Ref OrganizationTargetIds]
          PARTITION: !Ref AWS::Partition
          REGION_ALLOW_LIST: !Ref RegionAllowList
          RUN_TABLE: !Ref CollectionRunTable
          SOURCE_ACCOUNT_ID: !Ref AWS::AccountId
          SOURCE_REGION: !Ref AWS::Region
      KmsKeyArn: !GetAtt EvidenceKey.Arn
      TracingConfig:
        Mode: Active

  FinalizerFunction:
    Type: AWS::Lambda::Function
    DependsOn: FinalizerLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-finalizer
      Runtime: python3.13
      Handler: index.finalizer_handler
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 300
      ReservedConcurrentExecutions: 2
      Role: !GetAtt FinalizerRole.Arn
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: !Ref LambdaArtifactKey
      Environment:
        Variables:
          EVIDENCE_BUCKET: !Ref EvidenceBucket
          EXCLUDED_ACCOUNT_IDS: !Ref ExcludedAccountIds
          KMS_KEY_ARN: !GetAtt EvidenceKey.Arn
          MAX_REGION_CONCURRENCY: !Ref MaximumRegionConcurrency
          MEMBER_ROLE_NAME: !Ref MemberReadRoleName
          ORGANIZATION_TARGET_IDS: !Join [",", !Ref OrganizationTargetIds]
          PARTITION: !Ref AWS::Partition
          REGION_ALLOW_LIST: !Ref RegionAllowList
          RUN_TABLE: !Ref CollectionRunTable
          SOURCE_ACCOUNT_ID: !Ref AWS::AccountId
          SOURCE_REGION: !Ref AWS::Region
      KmsKeyArn: !GetAtt EvidenceKey.Arn
      TracingConfig:
        Mode: Active

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/vendedlogs/states/${AWS::StackName}-organization-collection
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !GetAtt EvidenceKey.Arn

  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GatewatchOrganizationOrchestration
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeCollectionFunctions
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt DiscoveryFunction.Arn
                  - !GetAtt WorkerFunction.Arn
                  - !GetAtt FinalizerFunction.Arn
              - Sid: ReadCollectionTargets
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${EvidenceBucket.Arn}/runs/*/targets.json
              - Sid: DistributedMapExecutions
                Effect: Allow
                Action:
                  - states:DescribeExecution
                  - states:StartExecution
                  - states:StopExecution
                Resource: "*"
              - Sid: StateMachineLogs
                Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"

  CollectionStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${AWS::StackName}-organization-collection
      StateMachineType: STANDARD
      RoleArn: !GetAtt StateMachineRole.Arn
      LoggingConfiguration:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
        IncludeExecutionData: false
        Level: ERROR
      TracingConfiguration:
        Enabled: true
      DefinitionString: !Sub |
        {
          "Comment": "Discover accounts, collect isolated evidence shards, and finalize explicit coverage.",
          "StartAt": "DiscoverAccounts",
          "States": {
            "DiscoverAccounts": {
              "Type": "Task",
              "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${DiscoveryFunction.Arn}",
                "Payload.$": "$"
              },
              "OutputPath": "$.Payload",
              "Retry": [{
                "ErrorEquals": ["Lambda.ServiceException", "Lambda.TooManyRequestsException", "Lambda.SdkClientException"],
                "IntervalSeconds": 2,
                "BackoffRate": 2,
                "MaxAttempts": 4
              }],
              "Next": "CollectAccounts"
            },
            "CollectAccounts": {
              "Type": "Map",
              "MaxConcurrency": ${MaximumAccountConcurrency},
              "ItemReader": {
                "Resource": "arn:${AWS::Partition}:states:::s3:getObject",
                "ReaderConfig": {"InputType": "JSON"},
                "Parameters": {
                  "Bucket.$": "$.targetsBucket",
                  "Key.$": "$.targetsKey"
                }
              },
              "ItemSelector": {
                "runId.$": "$.runId",
                "account.$": "$$.Map.Item.Value"
              },
              "ItemProcessor": {
                "ProcessorConfig": {"Mode": "DISTRIBUTED", "ExecutionType": "EXPRESS"},
                "StartAt": "CollectAccount",
                "States": {
                  "CollectAccount": {
                    "Type": "Task",
                    "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${WorkerFunction.Arn}",
                      "Payload.$": "$"
                    },
                    "ResultSelector": {"status.$": "$.Payload.status"},
                    "End": true
                  }
                }
              },
              "ResultPath": "$.mapResult",
              "Catch": [{
                "ErrorEquals": ["States.ALL"],
                "ResultPath": "$.mapFailure",
                "Next": "FinalizeRun"
              }],
              "Next": "FinalizeRun"
            },
            "FinalizeRun": {
              "Type": "Task",
              "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${FinalizerFunction.Arn}",
                "Payload": {"runId.$": "$.runId"}
              },
              "OutputPath": "$.Payload",
              "Retry": [{
                "ErrorEquals": ["Lambda.ServiceException", "Lambda.TooManyRequestsException", "Lambda.SdkClientException"],
                "IntervalSeconds": 2,
                "BackoffRate": 2,
                "MaxAttempts": 4
              }],
              "End": true
            }
          }
        }

  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartGatewatchCollection
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref CollectionStateMachine

  CollectionSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Starts Gatewatch's organization-wide evidence collection.
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Arn: !Ref CollectionStateMachine
          Id: GatewatchOrganizationCollection
          RoleArn: !GetAtt ScheduleRole.Arn
          Input: '{"trigger":"schedule"}'

  FailedExecutionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Gatewatch organization collection state machine failed.
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref CollectionStateMachine
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  ThrottledWorkerAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Gatewatch organization account workers were throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref WorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

Outputs:
  EvidenceBucketName:
    Description: Encrypted organization evidence bucket; pass this to the Gatewatch platform stack.
    Value: !Ref EvidenceBucket
  EvidenceBucketArn:
    Value: !GetAtt EvidenceBucket.Arn
  EvidenceKeyArn:
    Value: !GetAtt EvidenceKey.Arn
  LatestManifestUri:
    Value: !Sub s3://${EvidenceBucket}/manifests/latest.json
  CollectionRunTableName:
    Value: !Ref CollectionRunTable
  CollectionStateMachineArn:
    Value: !Ref CollectionStateMachine
  MemberReadRoleName:
    Value: !Ref MemberReadRoleName
